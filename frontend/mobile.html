<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122c29"><title>Wayfinder · Phone</title>
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <main>
    <p class="brand">WAYFINDER</p><h1>Your voice.<br>Your next step.</h1>
    <p id="status" role="status">Connect your camera and microphone to begin.</p>
    <button id="allow-permissions" class="primary">Allow camera &amp; microphone</button>
    <section aria-label="Voice input">
      <p class="label">YOU SAID</p><p id="transcript">Tell me what you want to find.</p>
      <button id="record-command" disabled>Tap to speak</button>
    </section>
    <section aria-label="Spoken guidance">
      <p class="label">YOUR NEXT STEP</p><p id="spoken-output" aria-live="off">Waiting for your voice command.</p>
      <button id="repeat-guidance" disabled>Hear again</button>
      <button id="pause-guidance" disabled>Pause guidance</button>
    </section>
    <video id="phone-video" class="capture-video" autoplay muted playsinline aria-hidden="true" tabindex="-1"></video>
  </main>
  <script src="/orientation.js"></script><script src="/feedback.js"></script><script src="/speech.js"></script><script src="/mobile.js"></script>
</body>
</html>
