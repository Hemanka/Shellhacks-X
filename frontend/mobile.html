<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wayfinder Phone Camera</title><link rel="stylesheet" href="/camera.css?v=2"></head><body class="mobile-camera"><main><p class="placeholder-kicker">WAYFINDER / PHONE CAMERA</p><h1>Phone camera connected</h1><p id="status">Starting camera...</p><video id="phone-video" autoplay muted playsinline></video><button id="start-camera">Enable camera</button></main><script>
const session = new URLSearchParams(location.search).get("session"); const video = document.getElementById("phone-video"); const button = document.getElementById("start-camera"); const status = document.getElementById("status"); const canvas = document.createElement("canvas"); let socket; let stream;
async function start(){ if(!session){status.textContent="Invalid pairing link.";return} if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){status.textContent="Camera access requires HTTPS. Open the QR from the Cloudflare HTTPS address."; return} try{ if(navigator.permissions?.query){const permission=await navigator.permissions.query({name:"camera"}); if(permission.state === "denied"){status.textContent="Camera permission is blocked for this site. Open browser site settings, set Camera to Allow, then reload this page."; return}} stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); video.srcObject=stream; await video.play(); socket=new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/pair/${session}?role=mobile`); socket.onopen=()=>{status.textContent="Connected. Keep this page open while scanning."; button.hidden=true; setInterval(sendFrame,1000)}; socket.onclose=()=>status.textContent="Disconnected from Wayfinder."}catch(error){const advice=error.name === "NotAllowedError" ? "Allow Camera for this Cloudflare site in browser site settings, then reload." : error.name === "NotFoundError" ? "No camera was found on this phone." : "Check the browser camera permission."; status.textContent=`Camera unavailable (${error.name}). ${advice}`}}
function sendFrame(){if(!socket||socket.readyState!==WebSocket.OPEN||!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext("2d").drawImage(video,0,0);socket.send(JSON.stringify({type:"frame",image_base64:canvas.toDataURL("image/jpeg",.65)}))} button.addEventListener("click",start); start();
</script></body></html>
